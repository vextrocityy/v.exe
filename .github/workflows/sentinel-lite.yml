name: sentinel-lite

on:
  push:
    paths: ["sentinel-lite/**", ".github/workflows/sentinel-lite.yml"]
  pull_request:
    paths: ["sentinel-lite/**", ".github/workflows/sentinel-lite.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: sentinel-lite

jobs:
  engine:
    name: Engine (test + Windows smoke test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentinel-lite
      - run: cargo clippy --locked -p sentinel-service -p sentinel-protocol --all-targets -- -D warnings
      - run: cargo test --locked -p sentinel-service -p sentinel-protocol
      - run: cargo build --locked --release -p sentinel-service
      - name: Build smoke-test helper (benign unsigned disk writer)
        run: cargo build --locked --release -p sentinel-service --example write_load
      - name: End-to-end smoke test (installs the real service)
        shell: pwsh
        env:
          # Optional repository secret; without it the live community-feed check is skipped.
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: ./scripts/smoke-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-service
          path: sentinel-lite/target/release/sentinel-service.exe

  installer:
    name: Installer (build + silent install/uninstall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentinel-lite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck dashboard
        working-directory: sentinel-lite/ui
        run: npm ci && npm run typecheck
      - name: Build installer
        shell: pwsh
        env:
          SENTINEL_UPDATE_PUBKEYS: ${{ vars.SENTINEL_UPDATE_PUBKEYS }}
          # Build number baked into the engine; matches the release tag, so installs can self-update.
          SENTINEL_BUILD: ${{ github.run_number }}
        run: ./scripts/build-release.ps1
      - name: Clippy (dashboard backend)
        run: cargo clippy --locked -p sentinel-ui -- -D warnings
      - name: Silent install, verify, uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          $dir = "C:\Program Files\Sentinel-Lite"
          foreach ($f in "sentinel-lite.exe", "sentinel-service.exe", "signatures\core.json", "rules\sentinel-test.yar") {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
          }
          $svc = Get-Service SentinelLite
          if ($svc.Status -ne "Running") { throw "service not running: $($svc.Status)" }
          $status = (& "$dir\sentinel-service.exe" status | Out-String | ConvertFrom-Json).data
          "State: $($status.state | ConvertTo-Json -Compress)  signatures: $($status.signature_count)"
          if ($status.signature_count -lt 2) { throw "bundled signatures not loaded" }
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and ((& "$dir\sentinel-service.exe" status | Out-String | ConvertFrom-Json).data.yara_rule_count -lt 1)) { Start-Sleep 1 }
          $yara = (& "$dir\sentinel-service.exe" status | Out-String | ConvertFrom-Json).data.yara_rule_count
          if ($yara -lt 1) { throw "bundled YARA rules not loaded" }
          "YARA rules loaded: $yara"
          # A client outside the install directory must be refused.
          $rogue = Join-Path $env:TEMP "rogue-client.exe"
          Copy-Item "$dir\sentinel-service.exe" $rogue
          $out = & $rogue status 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw "untrusted client was allowed to connect" }
          if ($out -notmatch "not a trusted Sentinel-Lite component") { throw "unexpected refusal: $out" }
          "Untrusted client refused as expected"
          if (-not (Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Run")."Sentinel-Lite") { throw "autostart entry missing" }
          # --- Self-update: serve a "newer" release locally and let the service install it ---
          $svc = "$dir\sentinel-service.exe"
          $build = [int]((& $svc version) -replace '.*build (\d+).*', '$1')
          if ($build -lt 1) { throw "installed engine has no build number" }
          $srv = Join-Path $env:TEMP "update-server"; New-Item -ItemType Directory -Force $srv | Out-Null
          $name = $installer.Name
          Copy-Item $installer.FullName (Join-Path $srv $name)
          $hash = (Get-FileHash (Join-Path $srv $name) -Algorithm SHA256).Hash.ToLower()
          Set-Content (Join-Path $srv "SHA256SUMS.txt") "$hash  $name" -Encoding ascii
          $next = $build + 1
          @{ tag_name = "sentinel-lite-build-$next"; draft = $false; prerelease = $false; assets = @(
              @{ name = $name; browser_download_url = "http://127.0.0.1:8765/$name" },
              @{ name = "SHA256SUMS.txt"; browser_download_url = "http://127.0.0.1:8765/SHA256SUMS.txt" }) } |
            ConvertTo-Json -Depth 4 | Set-Content (Join-Path $srv "latest") -Encoding ascii
          $server = Start-Job -ArgumentList $srv -ScriptBlock {
            param($root)
            $l = [System.Net.HttpListener]::new(); $l.Prefixes.Add("http://127.0.0.1:8765/"); $l.Start()
            while ($true) {
              $ctx = $l.GetContext(); $p = Join-Path $root $ctx.Request.Url.AbsolutePath.TrimStart('/')
              if (Test-Path $p -PathType Leaf) { $b = [IO.File]::ReadAllBytes($p); $ctx.Response.ContentLength64 = $b.Length; $ctx.Response.OutputStream.Write($b, 0, $b.Length) }
              else { $ctx.Response.StatusCode = 404 }
              $ctx.Response.Close()
            }
          }
          Start-Sleep 2
          $settings = (& $svc settings | Out-String | ConvertFrom-Json).data
          $settings.app_update_api = "http://127.0.0.1:8765/latest"
          $json = @{ type = "update_settings"; data = @{ settings = $settings } } | ConvertTo-Json -Depth 8 -Compress
          & $svc elevated-request (-join ([Text.Encoding]::UTF8.GetBytes($json) | ForEach-Object { $_.ToString("x2") }))
          if ($LASTEXITCODE) { throw "could not point the updater at the test server" }
          $before = (Get-Process sentinel-service).StartTime
          & $svc app-update | Out-Host
          $deadline = (Get-Date).AddSeconds(150); $done = $false
          while ((Get-Date) -lt $deadline -and -not $done) {
            Start-Sleep 3
            try {
              $ev = (& $svc events 30 | Out-String | ConvertFrom-Json).data
              $done = [bool]($ev | Where-Object { $_.title -like "Updated to build*" -or $_.title -like "Update to build $next did not complete*" })
            } catch { }
          }
          Stop-Job $server; Remove-Job $server -Force
          if (-not $done) { throw "self-update did not complete (no post-update event)" }
          $ev | Select-Object -First 6 | Format-Table severity, title -AutoSize | Out-Host
          if (-not ($ev | Where-Object { $_.title -eq "Installing Sentinel-Lite build $next" })) { throw "updater never started the installer" }
          if ((Get-Service SentinelLite).Status -ne "Running") { throw "service not running after self-update" }
          if ((Get-Process sentinel-service).StartTime -le $before) { throw "service was not restarted by the update" }
          "Self-update OK: downloaded, SHA-256 verified, installed silently, service restarted"
          # (The test reuses the same installer, so the restarted service correctly reports it is
          #  still build $build: the mechanism, not a version change, is what is verified here.)

          Start-Process "$dir\uninstall.exe" -ArgumentList "/S" -Wait
          # The NSIS uninstaller relaunches itself from %TEMP%, so -Wait returns early: poll.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and (Get-Service SentinelLite -ErrorAction SilentlyContinue)) { Start-Sleep 2 }
          if (Get-Service SentinelLite -ErrorAction SilentlyContinue) { throw "service still registered 60 s after uninstall" }
          "Install / verify / uninstall OK"
          exit 0   # the refused-client check above leaves a non-zero $LASTEXITCODE by design
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-lite-installer
          path: sentinel-lite/target/release/bundle/nsis/*-setup.exe

  release:
    name: Publish GitHub Release
    # Only builds that passed the Windows smoke test AND the install/uninstall test.
    needs: [engine, installer]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sentinel-lite-installer
          path: dist
      - name: Checksums and release notes
        id: meta
        run: |
          cd dist
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "tag=sentinel-lite-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          {
            echo "Automated build of commit ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}."
            echo
            echo "This build passed the Windows smoke test (real service install, File Shield, Process Guard,"
            echo "YARA, archive scanning, ransomware decoys, startup clean-up) and the silent install/uninstall test."
            echo
            echo "**Personal, unsigned test build.** Windows SmartScreen will warn: choose *More info → Run anyway*."
            echo "Keep Microsoft Defender enabled alongside it."
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Sentinel-Lite build ${{ github.run_number }}
          body_path: notes.md
          make_latest: true
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt
