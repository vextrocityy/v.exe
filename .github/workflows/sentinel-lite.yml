name: sentinel-lite

on:
  push:
    paths: ["sentinel-lite/**", ".github/workflows/sentinel-lite.yml"]
  pull_request:
    paths: ["sentinel-lite/**", ".github/workflows/sentinel-lite.yml"]
  # Run by hand with a build number to release that (already tested) build to
  # everyone; with the field empty it just builds and tests like a push.
  workflow_dispatch:
    inputs:
      promote_build:
        description: "Build number to release to all installs (e.g. 33). Leave empty to only build a test build."
        required: false
        default: ""

# Releases are gated. Every push builds, tests and publishes a PRE-RELEASE
# ("Vigil build N (test)"): downloadable from the Releases page, but installs
# never update to it (the updater and /releases/latest ignore pre-releases).
# A build reaches everyone only when someone promotes it: Actions > sentinel-lite >
# Run workflow > promote_build = N.

defaults:
  run:
    working-directory: sentinel-lite

# Read-only token by default; only the release job may write.
permissions:
  contents: read

# One run at a time per branch, in order: a slower older run must never publish
# "latest" after a newer one.
concurrency:
  group: sentinel-lite-${{ github.ref }}
  cancel-in-progress: false

jobs:
  engine:
    if: ${{ !inputs.promote_build }}
    name: Engine (test + Windows smoke test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentinel-lite
      - run: cargo clippy --locked -p sentinel-service -p sentinel-protocol --all-targets -- -D warnings
      - run: cargo test --locked -p sentinel-service -p sentinel-protocol
      - run: cargo build --locked --release -p sentinel-service
      - name: Build smoke-test helper (benign unsigned disk writer)
        run: cargo build --locked --release -p sentinel-service --example write_load
      - name: End-to-end smoke test (installs the real service)
        shell: pwsh
        env:
          # Optional repository secret; without it the live community-feed check is skipped.
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: ./scripts/smoke-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-service
          path: sentinel-lite/target/release/sentinel-service.exe

  installer:
    if: ${{ !inputs.promote_build }}
    name: Installer (build + silent install/uninstall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentinel-lite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck dashboard
        working-directory: sentinel-lite/ui
        run: npm ci && npm run typecheck
      - name: Build installer
        shell: pwsh
        env:
          SENTINEL_UPDATE_PUBKEYS: ${{ vars.SENTINEL_UPDATE_PUBKEYS }}
          # Build number baked into the engine; matches the release tag, so installs can self-update.
          SENTINEL_BUILD: ${{ github.run_number }}
        run: ./scripts/build-release.ps1
      - name: Clippy (dashboard backend)
        run: cargo clippy --locked -p sentinel-ui -- -D warnings
      - name: Upgrade from Sentinel-Lite (pre-rename) build 18
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # The last release before the rename; real installs (and their self-updater) start here.
          $old = Join-Path $env:TEMP "Sentinel-Lite_0.1.0_x64-setup.exe"
          # Via the API asset endpoint: the github.com/.../releases/download/ path has had 504 outages.
          $url = "https://api.github.com/repos/vextrocityy/v.exe/releases/assets/726112307"
          $headers = @{ Accept = "application/octet-stream"; Authorization = "Bearer $env:GH_TOKEN" }
          foreach ($try in 1..6) {
            try { Invoke-WebRequest $url -Headers $headers -OutFile $old; break }
            catch { if ($try -eq 6) { throw }; Write-Host "download failed ($($_.Exception.Message)), retrying"; Start-Sleep (10 * $try) }
          }
          Start-Process $old -ArgumentList "/S" -Wait
          $oldDir = "C:\Program Files\Sentinel-Lite"
          if ((Get-Service SentinelLite).Status -ne "Running") { throw "old build did not start" }
          if (-not (Test-Path "$oldDir\sentinel-service.exe")) { throw "old build not installed where expected" }
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and (Test-Path $oldDir)) { Start-Sleep 2 }
          $image = (Get-ItemProperty "HKLM:\SYSTEM\CurrentControlSet\Services\SentinelLite").ImagePath
          "Service image after upgrade: $image"
          if ($image -notlike "*\Program Files\Vigil\sentinel-service.exe*") { throw "service still points at the old folder" }
          if ((Get-Service SentinelLite).Status -ne "Running") { throw "service not running after upgrade" }
          if (Test-Path $oldDir) { Get-ChildItem $oldDir -Recurse | Out-Host; throw "old Sentinel-Lite folder left behind" }
          $run = Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Run"
          if ($run."Sentinel-Lite") { throw "old autostart entry left behind" }
          if (-not $run."Vigil") { throw "Vigil autostart entry missing" }
          if (Test-Path "HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Sentinel-Lite") { throw "old uninstall entry left behind" }
          # YARA must be protecting again shortly after the upgrade (the rules moved folders).
          $vsvc = "C:\Program Files\Vigil\sentinel-service.exe"
          $deadline = (Get-Date).AddSeconds(120)
          while ((Get-Date) -lt $deadline -and ((& $vsvc status | Out-String | ConvertFrom-Json).data.yara_rule_count -lt 1)) { Start-Sleep 2 }
          $st = (& $vsvc status | Out-String | ConvertFrom-Json).data
          if ($st.yara_rule_count -lt 1) { $st.shields | Format-Table name, running, detail -AutoSize | Out-Host; throw "YARA rules not active after upgrade" }
          "State after upgrade: $($st.state | ConvertTo-Json -Compress)  YARA rules: $($st.yara_rule_count)"
          "Upgrade from Sentinel-Lite build 18 OK"
      - name: Silent install, verify, uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          $dir = "C:\Program Files\Vigil"
          foreach ($f in "vigil.exe", "sentinel-service.exe", "signatures\core.json", "rules\sentinel-test.yar") {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
          }
          $svc = Get-Service SentinelLite
          if ($svc.Status -ne "Running") { throw "service not running: $($svc.Status)" }
          $status = (& "$dir\sentinel-service.exe" status | Out-String | ConvertFrom-Json).data
          "State: $($status.state | ConvertTo-Json -Compress)  signatures: $($status.signature_count)"
          if ($status.signature_count -lt 2) { throw "bundled signatures not loaded" }
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and ((& "$dir\sentinel-service.exe" status | Out-String | ConvertFrom-Json).data.yara_rule_count -lt 1)) { Start-Sleep 1 }
          $yara = (& "$dir\sentinel-service.exe" status | Out-String | ConvertFrom-Json).data.yara_rule_count
          if ($yara -lt 1) { throw "bundled YARA rules not loaded" }
          "YARA rules loaded: $yara"
          # A client outside the install directory must be refused.
          $rogue = Join-Path $env:TEMP "rogue-client.exe"
          Copy-Item "$dir\sentinel-service.exe" $rogue
          $out = & $rogue status 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw "untrusted client was allowed to connect" }
          if ($out -notmatch "not a trusted Vigil component") { throw "unexpected refusal: $out" }
          "Untrusted client refused as expected"
          if (-not (Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Run")."Vigil") { throw "autostart entry missing" }
          # --- Self-update: serve a "newer" release locally and let the service install it ---
          $svc = "$dir\sentinel-service.exe"
          $build = [int]((& $svc version) -replace '.*build (\d+).*', '$1')
          if ($build -lt 1) { throw "installed engine has no build number" }
          $srv = Join-Path $env:TEMP "update-server"; New-Item -ItemType Directory -Force $srv | Out-Null
          $name = $installer.Name
          Copy-Item $installer.FullName (Join-Path $srv $name)
          $hash = (Get-FileHash (Join-Path $srv $name) -Algorithm SHA256).Hash.ToLower()
          Set-Content (Join-Path $srv "SHA256SUMS.txt") "$hash  $name" -Encoding ascii
          $next = $build + 1
          @{ tag_name = "sentinel-lite-build-$next"; draft = $false; prerelease = $false; assets = @(
              @{ name = $name; browser_download_url = "http://127.0.0.1:8765/$name" },
              @{ name = "SHA256SUMS.txt"; browser_download_url = "http://127.0.0.1:8765/SHA256SUMS.txt" }) } |
            ConvertTo-Json -Depth 4 | Set-Content (Join-Path $srv "latest") -Encoding ascii
          $server = Start-Job -ArgumentList $srv -ScriptBlock {
            param($root)
            $l = [System.Net.HttpListener]::new(); $l.Prefixes.Add("http://127.0.0.1:8765/"); $l.Start()
            while ($true) {
              $ctx = $l.GetContext(); $p = Join-Path $root $ctx.Request.Url.AbsolutePath.TrimStart('/')
              if (Test-Path $p -PathType Leaf) { $b = [IO.File]::ReadAllBytes($p); $ctx.Response.ContentLength64 = $b.Length; $ctx.Response.OutputStream.Write($b, 0, $b.Length) }
              else { $ctx.Response.StatusCode = 404 }
              $ctx.Response.Close()
            }
          }
          Start-Sleep 2
          $settings = (& $svc settings | Out-String | ConvertFrom-Json).data
          $settings.app_update_api = "http://127.0.0.1:8765/latest"
          $json = @{ type = "update_settings"; data = @{ settings = $settings } } | ConvertTo-Json -Depth 8 -Compress
          & $svc elevated-request (-join ([Text.Encoding]::UTF8.GetBytes($json) | ForEach-Object { $_.ToString("x2") }))
          if ($LASTEXITCODE) { throw "could not point the updater at the test server" }
          $before = (Get-Process sentinel-service).StartTime
          & $svc app-update | Out-Host
          $deadline = (Get-Date).AddSeconds(150); $done = $false
          while ((Get-Date) -lt $deadline -and -not $done) {
            Start-Sleep 3
            try {
              $ev = (& $svc events 30 | Out-String | ConvertFrom-Json).data
              $done = [bool]($ev | Where-Object { $_.title -like "Updated to *" -or $_.title -like "Update to build $next did not complete*" })
            } catch { }
          }
          Stop-Job $server; Remove-Job $server -Force
          if (-not $done) { throw "self-update did not complete (no post-update event)" }
          $ev | Select-Object -First 6 | Format-Table severity, title -AutoSize | Out-Host
          if (-not ($ev | Where-Object { $_.title -like "Installing Vigil*build $next*" })) { throw "updater never started the installer" }
          if ((Get-Service SentinelLite).Status -ne "Running") { throw "service not running after self-update" }
          if ((Get-Process sentinel-service).StartTime -le $before) { throw "service was not restarted by the update" }
          if (Get-ScheduledTask -TaskName VigilUpdateWatchdog -ErrorAction SilentlyContinue) { throw "update watchdog task left behind after a successful update" }
          $log = Get-Content "$env:ProgramData\SentinelLite\logs\service.log" -Raw
          if ($log -notmatch "update watchdog armed \(xml\)") { throw "the update watchdog was not registered from its XML definition" }
          "install log:"; Get-Content "$env:ProgramData\SentinelLite\logs\install.log" -ErrorAction SilentlyContinue | Out-Host
          "Self-update OK: downloaded, SHA-256 verified, installed silently, service restarted"
          # (The test reuses the same installer, so the restarted service correctly reports it is
          #  still build $build: the mechanism, not a version change, is what is verified here.)

          Start-Process "$dir\uninstall.exe" -ArgumentList "/S" -Wait
          # The NSIS uninstaller relaunches itself from %TEMP%, so -Wait returns early: poll.
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and (Get-Service SentinelLite -ErrorAction SilentlyContinue)) { Start-Sleep 2 }
          if (Get-Service SentinelLite -ErrorAction SilentlyContinue) {
            "--- diagnostics ---"
            sc.exe queryex SentinelLite | Out-Host
            Get-Process sentinel*, vigil*, uninstall*, Un_A* -ErrorAction SilentlyContinue | Format-Table Id, ProcessName, StartTime, Path -AutoSize | Out-Host
            "install dir:"; Get-ChildItem $dir -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Name | Out-Host
            Get-ChildItem "$env:ProgramData\SentinelLite\logs" -ErrorAction SilentlyContinue | Sort-Object LastWriteTime | Select-Object -Last 1 | ForEach-Object { Get-Content $_.FullName -Tail 40 } | Out-Host
            throw "service still registered 60 s after uninstall"
          }
          "Install / verify / uninstall OK"
          exit 0   # the refused-client check above leaves a non-zero $LASTEXITCODE by design
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-lite-installer
          path: sentinel-lite/target/release/bundle/nsis/*-setup.exe

  release:
    name: Publish test build (pre-release)
    # Only builds that passed the Windows smoke test AND the install/uninstall test.
    needs: [engine, installer]
    if: ${{ !inputs.promote_build && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: sentinel-lite-installer
          path: dist
      - name: Checksums and release notes
        id: meta
        run: |
          cd dist
          # v0.2 from Vigil_0.2.0_x64-setup.exe (v0.2.1 for a fix release).
          installer=$(ls Vigil_*-setup.exe | head -n1)
          semver=$(echo "$installer" | cut -d_ -f2)
          echo "version=v${semver%.0}" >> "$GITHUB_OUTPUT"
          # A copy under a name that never changes, for a permanent download link:
          # .../releases/latest/download/Vigil-setup.exe
          cp "$installer" Vigil-setup.exe
          sha256sum *.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
          echo "tag=sentinel-lite-build-${{ github.run_number }}" >> "$GITHUB_OUTPUT"
          {
            echo "Automated build of commit ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}."
            echo
            echo "**Test build.** Installed copies do not update to it until it is promoted"
            echo "(Actions > sentinel-lite > Run workflow > promote_build = ${{ github.run_number }})."
            echo
            echo "This build passed the Windows smoke test (real service install, File Shield, Process Guard,"
            echo "YARA, archive scanning, ransomware decoys and rollback, startup clean-up, scheduled tasks) and the"
            echo "silent install / upgrade-from-Sentinel-Lite / uninstall test. Vigil was formerly called Sentinel-Lite."
            echo
            echo "**Personal, unsigned test build.** Windows SmartScreen will warn: choose *More info → Run anyway*."
            echo "Keep Microsoft Defender enabled alongside it."
            echo
            echo "SHA-256:"
            echo '```'
            cat SHA256SUMS.txt
            echo '```'
          } > ../notes.md
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: Vigil ${{ steps.meta.outputs.version }} (build ${{ github.run_number }}, test)
          body_path: notes.md
          prerelease: true
          make_latest: false
          files: |
            dist/*.exe
            dist/SHA256SUMS.txt

  promote:
    name: Release a tested build to everyone
    if: ${{ inputs.promote_build }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    defaults:
      run:
        working-directory: .
    steps:
      - name: Promote
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD: ${{ inputs.promote_build }}
        run: |
          case "$BUILD" in ''|*[!0-9]*) echo "::error::promote_build must be a build number"; exit 1;; esac
          tag="sentinel-lite-build-$BUILD"
          # Must be a build this workflow published, with its installer and checksums.
          assets=$(gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name')
          echo "$assets" | grep -q -- '-setup\.exe$' || { echo "::error::$tag has no installer"; exit 1; }
          echo "$assets" | grep -qx 'SHA256SUMS.txt' || { echo "::error::$tag has no SHA256SUMS.txt"; exit 1; }
          # Never move "latest" backwards.
          latest=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null || true)
          latest_n=${latest#sentinel-lite-build-}
          case "$latest_n" in ''|*[!0-9]*) latest_n=0;; esac
          if [ "$BUILD" -le "$latest_n" ]; then echo "::error::build $BUILD is not newer than the released build $latest_n"; exit 1; fi
          semver=$(echo "$assets" | grep -- '^Vigil_.*-setup\.exe$' | head -n1 | cut -d_ -f2)
          title="Vigil build $BUILD"
          if [ -n "$semver" ]; then title="Vigil v${semver%.0} (build $BUILD)"; fi
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --prerelease=false --latest --title "$title"
          echo "Released build $BUILD: installs update to it within 6 hours."
