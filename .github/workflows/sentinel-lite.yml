name: sentinel-lite

on:
  push:
    paths: ["sentinel-lite/**", ".github/workflows/sentinel-lite.yml"]
  pull_request:
    paths: ["sentinel-lite/**", ".github/workflows/sentinel-lite.yml"]

defaults:
  run:
    working-directory: sentinel-lite

jobs:
  engine:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentinel-lite
      - run: cargo clippy -p sentinel-service -p sentinel-protocol --all-targets -- -D warnings
      - run: cargo test -p sentinel-service -p sentinel-protocol
      - run: cargo build --release -p sentinel-service
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-service
          path: sentinel-lite/target/release/sentinel-service.exe

  ui:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
        working-directory: sentinel-lite/ui
      - run: npm run build
        working-directory: sentinel-lite/ui
