name: sentinel-lite

on:
  push:
    paths: ["sentinel-lite/**", ".github/workflows/sentinel-lite.yml"]
  pull_request:
    paths: ["sentinel-lite/**", ".github/workflows/sentinel-lite.yml"]
  workflow_dispatch:

defaults:
  run:
    working-directory: sentinel-lite

jobs:
  engine:
    name: Engine (test + Windows smoke test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentinel-lite
      - run: cargo clippy --locked -p sentinel-service -p sentinel-protocol --all-targets -- -D warnings
      - run: cargo test --locked -p sentinel-service -p sentinel-protocol
      - run: cargo build --locked --release -p sentinel-service
      - name: Build smoke-test helper (benign unsigned disk writer)
        run: cargo build --locked --release -p sentinel-service --example write_load
      - name: End-to-end smoke test (installs the real service)
        shell: pwsh
        env:
          # Optional repository secret; without it the live community-feed check is skipped.
          ABUSECH_AUTH_KEY: ${{ secrets.ABUSECH_AUTH_KEY }}
        run: ./scripts/smoke-test.ps1
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-service
          path: sentinel-lite/target/release/sentinel-service.exe

  installer:
    name: Installer (build + silent install/uninstall)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: sentinel-lite
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Typecheck dashboard
        working-directory: sentinel-lite/ui
        run: npm ci && npm run typecheck
      - name: Build installer
        shell: pwsh
        env:
          SENTINEL_UPDATE_PUBKEYS: ${{ vars.SENTINEL_UPDATE_PUBKEYS }}
        run: ./scripts/build-release.ps1
      - name: Clippy (dashboard backend)
        run: cargo clippy --locked -p sentinel-ui -- -D warnings
      - name: Silent install, verify, uninstall
        shell: pwsh
        run: |
          $installer = Get-ChildItem target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          Start-Process $installer.FullName -ArgumentList "/S" -Wait
          $dir = "C:\Program Files\Sentinel-Lite"
          foreach ($f in "sentinel-lite.exe", "sentinel-service.exe", "signatures\core.json", "rules\sentinel-test.yar") {
            if (-not (Test-Path "$dir\$f")) { throw "missing $f" }
          }
          $svc = Get-Service SentinelLite
          if ($svc.Status -ne "Running") { throw "service not running: $($svc.Status)" }
          $status = (& "$dir\sentinel-service.exe" status | Out-String | ConvertFrom-Json).data
          "State: $($status.state | ConvertTo-Json -Compress)  signatures: $($status.signature_count)"
          if ($status.signature_count -lt 2) { throw "bundled signatures not loaded" }
          $deadline = (Get-Date).AddSeconds(60)
          while ((Get-Date) -lt $deadline -and ((& "$dir\sentinel-service.exe" status | Out-String | ConvertFrom-Json).data.yara_rule_count -lt 1)) { Start-Sleep 1 }
          $yara = (& "$dir\sentinel-service.exe" status | Out-String | ConvertFrom-Json).data.yara_rule_count
          if ($yara -lt 1) { throw "bundled YARA rules not loaded" }
          "YARA rules loaded: $yara"
          # A client outside the install directory must be refused.
          $rogue = Join-Path $env:TEMP "rogue-client.exe"
          Copy-Item "$dir\sentinel-service.exe" $rogue
          $out = & $rogue status 2>&1 | Out-String
          if ($LASTEXITCODE -eq 0) { throw "untrusted client was allowed to connect" }
          if ($out -notmatch "not a trusted Sentinel-Lite component") { throw "unexpected refusal: $out" }
          "Untrusted client refused as expected"
          if (-not (Get-ItemProperty "HKLM:\Software\Microsoft\Windows\CurrentVersion\Run")."Sentinel-Lite") { throw "autostart entry missing" }
          Start-Process "$dir\uninstall.exe" -ArgumentList "/S" -Wait
          Start-Sleep 10
          if (Get-Service SentinelLite -ErrorAction SilentlyContinue) { throw "service still registered after uninstall" }
          "Install / verify / uninstall OK"
          exit 0   # the refused-client check above leaves a non-zero $LASTEXITCODE by design
      - uses: actions/upload-artifact@v4
        with:
          name: sentinel-lite-installer
          path: sentinel-lite/target/release/bundle/nsis/*-setup.exe
